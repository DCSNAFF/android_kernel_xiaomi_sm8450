name: Build ArteXCrit Kernel with SukiSU-Ultra for Marble

on:
  workflow_dispatch:  # Manual run dari Actions tab
  push:
    branches: [ lineage-23.2 ]  # Default branch repo ini

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: false  # Clean repo, no need recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libelf-dev liblz4-tool libncurses5-dev libssl-dev python3 unzip zip zlib1g-dev cpio lzop rsync squashfs-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup AOSP Clang r522817 (Clang 22 equivalent, stable for 5.10 GKI)
        run: |
          # Download clang-r522817 tar.gz dari AOSP (format archive)
          mkdir -p \~/aosp-clang
          cd \~/aosp-clang
          # Pakai direct archive link dari googlesource (tar.gz available)
          wget -O clang-r522817.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/master/clang-r522817?format=TEXT" || {
            echo "Fallback to known mirror or adjust version"
            # Kalau link base64/text fail, coba manual tag atau mirror
            wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main/clang-r522817?format=TEXT -O base64.txt
            base64 -d base64.txt > clang.tar.gz
            rm base64.txt
          }
          tar -xzf clang-r522817.tar.gz --strip-components=1 || tar -xzf clang.tar.gz --strip-components=1
          echo "$PWD/bin" >> $GITHUB_PATH
          clang --version  # Harus show clang version \~18.0 or higher

      - name: Apply SukiSU-Ultra patches (KernelPatch latest)
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch --depth=1 sukisu-patches
          cd sukisu-patches
          bash setup.sh main || echo "Warnings OK if build proceeds"
          cd ..

      - name: Set Custom Kernel Name ArteXCrit
        run: |
          # Override after defconfig
          echo 'CONFIG_LOCALVERSION="-ArteXCrit"' >> .config || echo 'CONFIG_LOCALVERSION="-ArteXCrit"' > .config

      - name: Build GKI Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CLANG_TRIPLE: aarch64-linux-gnu-
        run: |
          export PATH=\~/proton-clang/bin:$PATH
          # Repo ini pakai build.config.gki.aarch64 untuk GKI
          # Jalankan build via env dari build.config
          BUILD_CONFIG=build.config.gki.aarch64 make -j$(nproc --all) || {
            # Fallback manual kalau build.config gagal
            make O=out ARCH=arm64 gki_defconfig
            make O=out ARCH=arm64 -j$(nproc --all)
          }

      - name: Package AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          cp out/arch/arm64/boot/Image* AnyKernel3/ || cp arch/arm64/boot/Image* AnyKernel3/
          # Copy DTBs (GKI butuh dtb untuk boot)
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/ \; || true
          cd AnyKernel3
          zip -r ../ArteXCrit-Marble-SukiSU.zip * -x .git
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArteXCrit-Kernel-marble
          path: ArteXCrit-Marble-SukiSU.zip
          retention-days: 7
